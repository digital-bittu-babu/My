<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediaGrowX Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,700;1,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column built for a phone. Four quantity rows, a message box to copy, a rates editor, and a total bar pinned to the bottom. Dark-first to match the MediaGrowX brand. */
:root {
  --bg: #060a07;
  --surface: #0d150e;
  --surface-2: #131f14;
  --field: #050a05;
  --line: rgba(120, 255, 70, 0.18);
  --fg: #e9eeea;
  --muted: #8d9b8f;
  --accent: #5af01e;
  --accent-2: #2fb80d;
  --on-accent: #031003;
  --warn: #ffb347;
  --font-display: "Exo 2", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f2f7ef; --surface: #ffffff; --surface-2: #eaf2e5; --field: #f7faf5;
    --line: rgba(20, 90, 10, 0.2); --fg: #101a11; --muted: #566657;
    --accent: #1f9d0a; --accent-2: #167a06; --on-accent: #ffffff; --warn: #a35b00;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f2f7ef; --surface: #ffffff; --surface-2: #eaf2e5; --field: #f7faf5;
  --line: rgba(20, 90, 10, 0.2); --fg: #101a11; --muted: #566657;
  --accent: #1f9d0a; --accent-2: #167a06; --on-accent: #ffffff; --warn: #a35b00;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 0;
  -webkit-font-smoothing: antialiased;
}
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 4px; }
.kicker { font-size: .78rem; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h1 { margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: clamp(1.9rem, 8vw, 2.4rem); line-height: 1.1; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); max-width: 46ch; text-wrap: pretty; }

.rows { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.row.active { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--accent); }
.r-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.r-name { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 1.25rem; }
.r-rate { color: var(--muted); font-size: .82rem; text-align: right; }
.r-input { display: flex; gap: 10px; align-items: center; }
.r-input input { flex: 1; min-width: 0; min-height: 52px; padding: 0 16px; border: 0; border-radius: 14px; background: var(--field); color: var(--fg); font: inherit; font-size: 1.15rem; font-variant-numeric: tabular-nums; box-shadow: inset 0 0 0 1px var(--line); }
.r-input input::placeholder { color: var(--muted); opacity: .7; }
.r-input input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.r-cost { min-width: 5.5rem; text-align: right; font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 1.4rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.row.active .r-cost { color: var(--accent); }
.r-bottom { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.add { min-height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--fg); font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.add:hover { box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
.warn { margin-left: auto; color: var(--warn); font-size: .82rem; font-weight: 500; }

.panel { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
h2 { margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 1.15rem; }
textarea { width: 100%; min-height: 150px; padding: 12px 14px; border: 0; border-radius: 12px; resize: vertical; background: var(--field); color: var(--fg); font: inherit; font-size: .95rem; line-height: 1.55; box-shadow: inset 0 0 0 1px var(--line); }
textarea:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { min-height: 48px; padding: 0 22px; border: 0; border-radius: 999px; font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 1rem; cursor: pointer; }
.btn-main { background: linear-gradient(180deg, var(--accent), var(--accent-2)); color: var(--on-accent); }
.btn-ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.btn:focus-visible, .add:focus-visible, summary:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
#status { color: var(--accent); font-size: .9rem; min-height: 1.4em; }

.fld { display: flex; flex-direction: column; gap: 8px; }
.fld > label, .fld > .lbl { color: var(--muted); font-size: .9rem; }
.fld input[type="text"] { width: 100%; min-height: 50px; padding: 0 16px; border: 0; border-radius: 14px; background: var(--field); color: var(--fg); font: inherit; font-size: 1rem; box-shadow: inset 0 0 0 1px var(--line); }
.fld input[type="text"]::placeholder { color: var(--muted); opacity: .7; }
.fld input[type="text"]:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.chip span { display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border-radius: 999px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; font-size: .92rem; }
.chip input:checked + span { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.chip input:focus-visible + span { outline: 2px solid var(--fg); outline-offset: 3px; }
details.rates { border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
details.rates summary { cursor: pointer; padding: 16px; font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 1.15rem; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.rates summary::-webkit-details-marker { display: none; }
details.rates summary::after { content: "+"; color: var(--accent); font-size: 1.4rem; line-height: 1; }
details.rates[open] summary::after { content: "\2212"; }
.rate-body { display: flex; flex-direction: column; gap: 14px; padding: 0 16px 16px; }
.rate-note { margin: 0; color: var(--muted); font-size: .88rem; }
.rate-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; align-items: end; }
.rate-row .nm { font-weight: 600; padding-bottom: 14px; }
.rate-row label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: .78rem; }
.rate-row input { width: 100%; min-width: 0; min-height: 46px; padding: 0 12px; border: 0; border-radius: 12px; background: var(--field); color: var(--fg); font: inherit; font-size: 1rem; box-shadow: inset 0 0 0 1px var(--line); }
.rate-row input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }

.totalbar {
  position: sticky; bottom: 0; z-index: 5; margin-inline: -4px;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 14px 18px calc(14px + env(safe-area-inset-bottom, 0px)); border-radius: 20px 20px 0 0;
  background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--accent), 0 -10px 30px rgba(0, 0, 0, .25);
}
.totalbar .lbl { color: var(--muted); font-size: .85rem; }
.totalbar .cnt { font-weight: 600; }
.totalbar .amt { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 2.3rem; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.totalbar .amt-wrap { text-align: right; }
.totalbar .was { color: var(--muted); font-size: .9rem; text-decoration: line-through; font-variant-numeric: tabular-nums; }
.fld input[type="number"] { width: 100%; min-height: 50px; padding: 0 16px; border: 0; border-radius: 14px; background: var(--field); color: var(--fg); font: inherit; font-size: 1rem; box-shadow: inset 0 0 0 1px var(--line); }
.fld input[type="number"]:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
@media (max-width: 380px) { .rate-row { grid-template-columns: 1fr 1fr; } .rate-row .nm { grid-column: 1 / -1; padding-bottom: 0; } }
</style>

<main class="app">
  <header>
    <div class="kicker">MediaGrowX</div>
    <h1>Price Calculator</h1>
    <p>Type how many the customer wants. Fill any one, or any mix. Empty rows are skipped.</p>
  </header>

  <section class="panel" aria-labelledby="od-h">
    <h2 id="od-h">Order details</h2>
    <div class="fld">
      <label for="link">Username or link of the account</label>
      <input id="link" type="text" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="@username or profile / post link">
    </div>
    <div class="fld">
      <span class="lbl" id="st-lbl">Order status</span>
      <div class="chips" role="radiogroup" aria-labelledby="st-lbl">
        <label class="chip"><input type="radio" name="status" value="" checked><span>No status</span></label>
        <label class="chip"><input type="radio" name="status" value="Order received"><span>Order received</span></label>
        <label class="chip"><input type="radio" name="status" value="Processing"><span>Processing</span></label>
        <label class="chip"><input type="radio" name="status" value="Completed"><span>Completed</span></label>
        <label class="chip"><input type="radio" name="status" value="Payment pending"><span>Payment pending</span></label>
      </div>
    </div>
  </section>

  <section class="rows" id="rows" aria-label="Quantities"></section>

  <section class="panel" aria-labelledby="msg-h">
    <h2 id="msg-h">Message for the customer</h2>
    <textarea id="msg" readonly placeholder="Enter a quantity above and the price message appears here."></textarea>
    <div class="actions">
      <button class="btn btn-main" id="copy" type="button">Copy message</button>
      <button class="btn btn-ghost" id="clear" type="button">Clear all</button>
      <span id="status" role="status"></span>
    </div>
  </section>

  <details class="rates" id="rates">
    <summary>Edit rates</summary>
    <div class="rate-body">
      <p class="rate-note">Price is for every 1,000. Minimum is the smallest order. Changes are saved on this device.</p>
      <div class="fld">
        <label for="offer">Offer discount on every order (%). Set 0 to turn the offer off.</label>
        <input id="offer" type="number" inputmode="decimal" min="0" max="100" step="any" value="70">
      </div>
      <div id="rate-grid"></div>
      <div class="actions"><button class="btn btn-ghost" id="reset" type="button">Reset to default rates</button></div>
    </div>
  </details>

  <div class="totalbar" aria-live="polite">
    <div><div class="lbl">Total</div><div class="cnt" id="cnt">Nothing added</div></div>
    <div class="amt-wrap"><div class="was" id="was" hidden></div><div class="amt" id="total">&#8377;0</div></div>
  </div>
</main>

<script>
var DEFAULTS = {
  Likes:     { per: 100, min: 100 },
  Views:     { per: 1,  min: 1000 },
  Comments:  { per: 400, min: 50 },
  Followers: { per: 700, min: 100 }
};
var NAMES = ["Likes", "Views", "Comments", "Followers"];
var STORE_KEY = "mgx-rates-v3";
var rates = JSON.parse(JSON.stringify(DEFAULTS));
var qty = { Likes: 0, Views: 0, Comments: 0, Followers: 0 };

try {
  var saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
  if (saved) NAMES.forEach(function (n) {
    if (saved[n] && isFinite(saved[n].per) && isFinite(saved[n].min) && saved[n].per >= 0 && saved[n].min >= 0) rates[n] = { per: +saved[n].per, min: +saved[n].min };
  });
} catch (e) {}
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(rates)); } catch (e) {} }

/* Offer: percent taken off the total. 70 = Chhath Puja offer. */
var OFFER_KEY = "mgx-offer-v1", OFFER_DEFAULT = 70, offer = OFFER_DEFAULT;
try {
  var o = JSON.parse(localStorage.getItem(OFFER_KEY) || "null");
  if (o && isFinite(o.pct) && o.pct >= 0 && o.pct <= 100) offer = +o.pct;
} catch (e) {}
function persistOffer() { try { localStorage.setItem(OFFER_KEY, JSON.stringify({ pct: offer })); } catch (e) {} }

function num(n) { return Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 }); }
function money(n) { return "₹" + num(Math.round(n * 100) / 100); }
function costOf(name, q) { return q / 1000 * rates[name].per; }

var $rows = document.getElementById("rows"), els = {};
NAMES.forEach(function (n) {
  var row = document.createElement("div");
  row.className = "row";
  row.innerHTML =
    '<div class="r-top"><span class="r-name">' + n + '</span><span class="r-rate"></span></div>' +
    '<div class="r-input"><input id="q-' + n + '" type="text" inputmode="numeric" autocomplete="off" placeholder="How many ' + n.toLowerCase() + '?" aria-label="Quantity of ' + n + '"><div class="r-cost">₹0</div></div>' +
    '<div class="r-bottom"><button class="add" type="button" data-add="1000">+1K</button><button class="add" type="button" data-add="5000">+5K</button><button class="add" type="button" data-add="10000">+10K</button><span class="warn" hidden></span></div>';
  $rows.appendChild(row);
  els[n] = { row: row, input: row.querySelector("input"), cost: row.querySelector(".r-cost"), rate: row.querySelector(".r-rate"), warn: row.querySelector(".warn") };
  els[n].input.addEventListener("input", function () {
    var d = this.value.replace(/\D/g, "").slice(0, 9);
    qty[n] = d ? parseInt(d, 10) : 0;
    var shown = d ? qty[n].toLocaleString("en-IN") : "";
    if (this.value !== shown) this.value = shown;
    calc();
  });
  row.querySelectorAll("[data-add]").forEach(function (b) {
    b.addEventListener("click", function () {
      qty[n] = Math.min(qty[n] + parseInt(b.getAttribute("data-add"), 10), 999999999);
      els[n].input.value = qty[n].toLocaleString("en-IN");
      calc();
    });
  });
});

function calc() {
  var total = 0, lines = [];
  NAMES.forEach(function (n) {
    var e = els[n], q = qty[n], r = rates[n];
    e.rate.textContent = money(r.per) + " per 1,000 · min " + num(r.min);
    if (q > 0) {
      var c = costOf(n, q); total += c; lines.push({ n: n, q: q, c: c });
      e.cost.textContent = money(c);
      e.row.classList.add("active");
      var low = q < r.min;
      e.warn.hidden = !low;
      e.warn.textContent = low ? "Below minimum " + num(r.min) : "";
    } else {
      e.cost.textContent = "₹0"; e.row.classList.remove("active"); e.warn.hidden = true;
    }
  });
  var subtotal = Math.ceil(Math.round(total * 100) / 100);
  var payable = offer > 0 ? Math.min(subtotal, Math.ceil(Math.round(subtotal * (100 - offer)) / 100 - 1e-9)) : subtotal;
  var off = subtotal - payable;
  var hasOffer = offer > 0 && lines.length > 0;
  document.getElementById("total").textContent = "₹" + num(payable);
  var was = document.getElementById("was");
  was.hidden = !hasOffer; was.textContent = hasOffer ? "₹" + num(subtotal) : "";
  document.getElementById("cnt").textContent = lines.length ? lines.length + (lines.length === 1 ? " item" : " items") + (hasOffer ? " · " + num(offer) + "% OFF" : "") : "Nothing added";
  var link = document.getElementById("link").value.trim();
  var st = (document.querySelector('input[name="status"]:checked') || { value: "" }).value;
  var text = "";
  if (lines.length || link || st) {
    var parts = ["MediaGrowX order"];
    if (link) parts.push("Account: " + link);
    if (st) parts.push("Status: " + st);
    lines.forEach(function (l) { parts.push(l.n + ": " + num(l.q) + " = " + money(l.c)); });
    if (lines.length) {
      if (hasOffer) {
        parts.push("Price: ₹" + num(subtotal));
        parts.push("Chhath Puja Offer " + num(offer) + "% OFF: -₹" + num(off));
        parts.push("You pay: ₹" + num(payable));
      } else parts.push("Total: ₹" + num(subtotal));
    }
    text = parts.join("\n");
  }
  document.getElementById("msg").value = text;
}

document.getElementById("link").addEventListener("input", calc);
document.querySelectorAll('input[name="status"]').forEach(function (r) { r.addEventListener("change", calc); });

/* Copy */
var statusEl = document.getElementById("status"), statusTimer;
function say(t) { statusEl.textContent = t; clearTimeout(statusTimer); statusTimer = setTimeout(function () { statusEl.textContent = ""; }, 2200); }
document.getElementById("copy").addEventListener("click", function () {
  var ta = document.getElementById("msg"), t = ta.value;
  if (!t) { say("Add a quantity first"); return; }
  function fallback() { ta.focus(); ta.select(); var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} say(ok ? "Copied" : "Selected. Tap Copy in the menu"); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { say("Copied"); }, fallback);
  else fallback();
});
document.getElementById("clear").addEventListener("click", function () {
  NAMES.forEach(function (n) { qty[n] = 0; els[n].input.value = ""; });
  document.getElementById("link").value = "";
  document.querySelector('input[name="status"][value=""]').checked = true;
  calc(); document.getElementById("link").focus();
});

/* Rates editor */
var grid = document.getElementById("rate-grid");
function buildRateGrid() {
  grid.innerHTML = NAMES.map(function (n) {
    return '<div class="rate-row" style="margin-bottom:12px"><div class="nm">' + n + '</div>' +
      '<label>Price per 1,000 (₹)<input id="rp-' + n + '" type="number" inputmode="decimal" min="0" step="any" value="' + rates[n].per + '"></label>' +
      '<label>Minimum<input id="rm-' + n + '" type="number" inputmode="numeric" min="0" step="1" value="' + rates[n].min + '"></label></div>';
  }).join("");
  NAMES.forEach(function (n) {
    function upd() {
      var p = parseFloat(document.getElementById("rp-" + n).value), m = parseInt(document.getElementById("rm-" + n).value, 10);
      if (isFinite(p) && p >= 0) rates[n].per = p;
      if (isFinite(m) && m >= 0) rates[n].min = m;
      persist(); calc();
    }
    document.getElementById("rp-" + n).addEventListener("input", upd);
    document.getElementById("rm-" + n).addEventListener("input", upd);
  });
}
document.getElementById("reset").addEventListener("click", function () {
  rates = JSON.parse(JSON.stringify(DEFAULTS)); persist(); buildRateGrid();
  offer = OFFER_DEFAULT; persistOffer(); document.getElementById("offer").value = offer;
  calc(); say("Rates reset");
});
buildRateGrid();
var offerEl = document.getElementById("offer");
offerEl.value = offer;
offerEl.addEventListener("input", function () {
  var v = parseFloat(this.value);
  if (isFinite(v) && v >= 0 && v <= 100) { offer = v; persistOffer(); calc(); }
});
calc();
</script>
